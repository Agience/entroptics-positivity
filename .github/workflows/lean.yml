# The proofs, on every push and pull request.
#
# Section 10 claims the Lean development is `sorry`-free and elaborates against Lean's three
# foundational axioms and no axiom of its own. Both halves are checked here rather than asserted:
# `lake build` fails on a `sorry`, and the axiom footprint is read out of the build's own output and
# compared against the three that are allowed.
#
# The second half is the one that needs care. `#print axioms` is an info message emitted while a
# declaration is ELABORATED, so a warm build replays nothing and prints an empty table -- which
# would pass a naive grep by saying nothing at all. A fresh runner has no build cache, so every
# elaboration here is cold by construction; the step below still refuses a run that found no
# footprint lines, because "no bad axioms" and "no axioms printed" must not look alike.

name: lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    name: sorry-free, on the foundational axioms
    runs-on: ubuntu-latest
    # CHOSEN: a wall-clock cap. With the Mathlib cache the build is a couple of minutes; without it,
    # hours. This bounds the case where the cache is unavailable and the build falls back to source.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat research/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The prebuilt Mathlib, which is the difference between a two-minute job and an hours-long one.
      - name: Fetch the Mathlib cache
        working-directory: research/lean
        run: lake exe cache get

      # pipefail explicitly: the default shell is `bash -e`, which reports the exit status of the
      # LAST command in a pipe. Without it a failing `lake build` piped through `tee` exits 0, and
      # the job reads green over a build that did not compile.
      - name: Build
        working-directory: research/lean
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee ../../lean-build.log

      # `lake build` already fails on a `sorry`, so this is not the primary check -- it is the one
      # that catches a `sorry` reintroduced behind an option that downgrades it to a warning.
      - name: Refuse a sorry
        run: |
          if grep -rn "sorry" research/lean/SignProblem*.lean research/lean/SignProblem/*.lean \
               | grep -v "no \`sorry\`"; then
            echo "::error::a sorry is present in the Lean sources."
            exit 1
          fi

      - name: Check the axiom footprint
        run: |
          printed=$(grep -c "depends on axioms" lean-build.log || echo 0)
          echo "declarations with a printed footprint: $printed"
          # An empty table and a clean table look identical to a grep for bad axioms, so the count
          # is checked first. The floor is the number of `#print axioms` lines in SignProblem.lean.
          if [ "${printed:-0}" -lt 48 ]; then
            echo "::error::only $printed axiom footprints printed; expected at least 48."
            echo "A warm build replays nothing -- if this fires on a cached runner, the build was not cold."
            exit 1
          fi
          # `Classical.choice`, `propext` and `Quot.sound` are Lean's own; anything else is this
          # development adding an axiom, which section 10 says it does not.
          if grep "depends on axioms" lean-build.log \
               | grep -vE "^\S*info: \S+: '[^']+' depends on axioms: \[propext, Classical\.choice, Quot\.sound\]$"; then
            echo "::error::a declaration depends on an axiom outside the three foundational ones."
            exit 1
          fi
          echo "all $printed declarations: [propext, Classical.choice, Quot.sound]"
